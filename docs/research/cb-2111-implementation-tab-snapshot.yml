                - heading "Architecture Notes" [level=3] [ref=e352]:
                  - img [ref=e354]
                  - text: Architecture Notes
                - paragraph [ref=e360]:
                  - text: Decision was made to implement the endpoint rather than remove the poller, preserving the RAG status visibility surface shipped in CB-2046. The backend endpoint is mounted via backend/api/
                  - strong [ref=e361]: init
                  - text: ".py at /api/system/rag/status. The Next.js proxy uses a 15-second AbortController timeout and maps upstream failures to 502/504 with Cache-Control: no-store to prevent stale health data being served from edge caches. The get_status_payload() helper in rag_service.py is designed to be fault-tolerant (never raises), surfacing all errors as healthy=False in the response payload."
              - generic [ref=e362]:
                - heading "Technical Notes" [level=3] [ref=e364]:
                  - img [ref=e366]
                  - text: Technical Notes
                - paragraph [ref=e370]: "backend/api/system.py received a corrected docstring after a security audit flagged an overclaim about Origin-header perimeter protection; the actual perimeter is loopback bind (127.0.0.1) not the CORS middleware. Follow-up tickets filed: CB-2372 (rate-limit the endpoint to protect ChromaDB), CB-2373 (redact abspath in RagStatusResponse.host), CB-2374 (wrap sync chromadb calls in get_status_payload to free the event loop). A helper script was written to scripts/codeboard/ per Rule 29 to file the follow-up issues via the Codeboard API."
              - generic [ref=e371]:
                - heading "Challenges" [level=3] [ref=e373]:
                  - img [ref=e375]
                  - text: Challenges
                - paragraph [ref=e379]: Multiple Claude Code session initializations observed in the execution log suggesting retries or pool churn. The Codeboard API calls to file follow-up issues required several curl attempts to locate the correct project ID and issue endpoint format before succeeding. Security audit initially flagged the docstring as HIGH severity, requiring an in-task fix before CWQ gate could be cleared.
              - generic [ref=e380]:
                - heading "Lessons Learned" [level=3] [ref=e382]:
                  - img [ref=e384]
                  - text: Lessons Learned
                - paragraph [ref=e388]: When a frontend poller exists for a missing endpoint, evaluate whether removing it causes a feature regression before defaulting to deletion — here removal would have broken a shipped RAG status badge. Audit gates (code-reviewer + security-auditor) should be run before marking CWQ, not after, to avoid rework cycles. Docstrings making security claims (e.g. about network perimeter) must accurately reflect actual bind configuration, not aspirational middleware intent.
